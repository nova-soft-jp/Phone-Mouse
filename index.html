<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Phone-Mouse - ワイヤレス・タッチパッド</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  body {
    margin: 0;
    padding: 0;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .top-bar {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    align-items: center;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #21262d;
    font-size: 11px;
    font-weight: 600;
    color: #8b949e;
    flex-shrink: 0;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    transition: background 0.2s;
  }
  .status-dot.connected {
    background: #3fb950;
    box-shadow: 0 0 8px #3fb950;
  }
  .signal-icon {
    width: 21px;
    height: 19px;
    color: #e6edf3;
    flex-shrink: 0;
  }
  .signal-icon .quality-arc { display: none; }
  .connection-alert {
    display: none;
    margin: 8px 10px;
    padding: 10px 12px;
    border: 1px solid #8b3a3a;
    border-radius: 8px;
    background: #2b1719;
    color: #ffb4ad;
    font-size: 13px;
    line-height: 1.45;
    touch-action: auto;
  }
  .connection-alert.visible { display: block; }
  .top-bar input {
    flex: 1;
    min-width: 0;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #ffffff;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 15px;
    touch-action: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  .top-bar input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  .btn {
    background: #21262d;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn:active {
    background: #30363d;
    transform: scale(0.96);
  }
  .btn-primary {
    background: #238636;
    border-color: #2ea043;
    color: #ffffff;
  }
  .btn-primary:active {
    background: #2ea043;
  }
  .key-strip {
    display: flex;
    gap: 6px;
    padding: 6px 10px;
    background: #12161c;
    border-bottom: 1px solid #21262d;
    overflow-x: auto;
  }
  .key-btn {
    flex: 1;
    background: #1c2128;
    border: 1px solid #30363d;
    color: #c9d1d9;
    border-radius: 6px;
    padding: 6px 4px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
  }
  .key-btn:active {
    background: #30363d;
    border-color: #58a6ff;
  }
  #pad {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 45%, rgba(56, 139, 253, 0.08) 0%, transparent 65%),
      linear-gradient(180deg, #0d1117 0%, #090c10 100%);
    overflow: hidden;
  }
  #pad.dragging {
    box-shadow: inset 0 0 28px rgba(56, 139, 253, 0.45);
    border: 1px solid rgba(88, 166, 255, 0.6);
  }
  .gesture-guide {
    color: #484f58;
    font-size: 12px;
    text-align: center;
    pointer-events: none;
    line-height: 1.8;
    padding: 0 20px;
  }
  .gesture-guide strong {
    color: #6e7681;
  }
  #dragBadge {
    position: absolute;
    top: 12px;
    background: rgba(31, 111, 235, 0.25);
    border: 1px solid #58a6ff;
    color: #58a6ff;
    font-size: 12px;
    font-weight: bold;
    padding: 5px 14px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
  }
  #dragBadge.visible {
    opacity: 1;
  }
  .bottom-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 8px 10px 12px;
    background: #161b22;
    border-top: 1px solid #30363d;
    height: 72px;
  }
  .click-btn {
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 10px;
    color: #e6edf3;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s;
  }
  .click-btn.active, .click-btn:active {
    background: rgba(56, 139, 253, 0.25);
    border-color: #58a6ff;
    color: #ffffff;
  }
  #settings-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13, 17, 23, 0.96);
    z-index: 20;
    padding: 24px 20px;
    flex-direction: column;
    gap: 20px;
  }
  #settings-panel.open {
    display: flex;
  }
  .setting-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .setting-header {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
  }
  .setting-header span {
    color: #58a6ff;
  }
  input[type="range"] {
    width: 100%;
    height: 28px;
    touch-action: auto;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="status-badge">
      <div id="dot" class="status-dot"></div>
      <span id="statusText">待機</span>
      <svg id="wifiQuality" class="signal-icon" viewBox="0 0 24 20" role="img" aria-label="通信状態：未接続">
        <path class="quality-arc" d="M9 13a4.25 4.25 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path class="quality-arc" d="M5.5 9.5a9.2 9.2 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path class="quality-arc" d="M2 6a14.2 14.2 0 0 1 20 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.5" fill="currentColor"/>
      </svg>
    </div>
    <input id="textInput" type="text" placeholder="PCへ文字入力..." enterkeyhint="send" readonly>
    <button class="btn btn-primary" id="sendBtn">送信</button>
    <button class="btn" id="cfgBtn">⚙</button>
  </div>
  <div id="connectionAlert" class="connection-alert" role="status" aria-live="polite"></div>

  <div class="key-strip">
    <button type="button" class="key-btn" id="selectAllBtn">全選択</button>
    <button type="button" class="key-btn" id="copyBtn">コピー</button>
    <div class="key-btn" id="backBtn">◀ 戻る</div>
    <div class="key-btn" id="fwdBtn">進む ▶</div>
    <div class="key-btn" id="escBtn">Esc</div>
    <div class="key-btn" id="tabBtn">Tab</div>
    <div class="key-btn" id="spaceBtn">Space</div>
    <div class="key-btn" id="bsBtn">⌫</div>
    <div class="key-btn" id="enterBtn">Enter ↵</div>
  </div>

  <div id="pad">
    <div id="dragBadge">ドラッグ中（指を離すと解除）</div>
    <div class="gesture-guide">
      <strong>1本指</strong>：カーソル移動 ／ タップ：左クリック<br>
      <strong>2回タップして長押し</strong>：ドラッグ＆ドロップ<br>
      <strong>2本指上下</strong>：スクロール ／ <strong>2本指タップ</strong>：右クリック<br>
      <strong>2本指左右スワイプ</strong>：ブラウザ戻る・進む
    </div>
  </div>

  <div class="bottom-bar">
    <div class="click-btn" id="leftBtn">左クリック（長押しドラッグ）</div>
    <div class="click-btn" id="rightBtn">右クリック</div>
  </div>

  <div id="settings-panel">
    <h3 style="margin:0; font-size:18px;">⚙ タッチパッド設定</h3>
    <div class="setting-card">
      <div class="setting-header">
        <label>カーソル感度</label>
        <span id="sensVal">1.2</span>
      </div>
      <input type="range" id="sensRange" min="0.4" max="3.5" step="0.1" value="1.2">
    </div>
    <div class="setting-card">
      <div class="setting-header">
        <label>スクロール速度</label>
        <span id="scrollVal">1.0</span>
      </div>
      <input type="range" id="scrollRange" min="0.3" max="3.0" step="0.1" value="1.0">
    </div>
    <div class="setting-card">
      <label style="display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:600; touch-action:auto;">
        <span>スクロール方向を反転（ナチュラル）</span>
        <input type="checkbox" id="invertChk" style="width:22px; height:22px; touch-action:auto;">
      </label>
    </div>
    <button class="btn btn-primary" id="closeCfgBtn" style="margin-top:auto; padding:14px; font-size:15px;">設定を保存して閉じる</button>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws = null;
  let reconnectTimer = null;
  let pingTimer = null;
  let qualityWatchdog = null;
  let pingSequence = 0;
  let lastPongAt = 0;
  let currentSignalBars = 0;
  const pendingPings = new Map();
  const recentRtts = [];

  function setSignalBars(count, reportSocket = null) {
    count = Math.max(0, Math.min(3, count));
    const changed = count !== currentSignalBars;
    currentSignalBars = count;
    const arcs = document.querySelectorAll("#wifiQuality .quality-arc");
    arcs.forEach((arc, index) => { arc.style.display = index < count ? "block" : "none"; });
    document.getElementById("wifiQuality").setAttribute(
      "aria-label", count === 0 ? "通信状態：未接続" : `通信状態：${count}本`
    );
    if (changed && reportSocket && reportSocket.readyState === WebSocket.OPEN) {
      reportSocket.send(JSON.stringify({ type: "quality", bars: count }));
    }
  }

  function stopQualityMonitor() {
    if (pingTimer !== null) clearInterval(pingTimer);
    if (qualityWatchdog !== null) clearInterval(qualityWatchdog);
    pingTimer = null;
    qualityWatchdog = null;
    pendingPings.clear();
    recentRtts.length = 0;
    lastPongAt = 0;
    currentSignalBars = 0;
    setSignalBars(0);
  }

  function startQualityMonitor(socket) {
    stopQualityMonitor();
    const sendPing = () => {
      if (ws !== socket || socket.readyState !== WebSocket.OPEN) return;
      const now = performance.now();
      for (const [id, sentAt] of pendingPings) {
        if (now - sentAt > 6000) pendingPings.delete(id);
      }
      const id = String(++pingSequence);
      pendingPings.set(id, now);
      socket.send(JSON.stringify({ type: "ping", id }));
    };
    sendPing();
    pingTimer = setInterval(sendPing, 2000);
    qualityWatchdog = setInterval(() => {
      if (lastPongAt && Date.now() - lastPongAt > 6000) setSignalBars(0, socket);
    }, 1000);
  }

  function showConnectionAlert(message = "") {
    const alert = document.getElementById("connectionAlert");
    alert.textContent = message;
    alert.classList.toggle("visible", Boolean(message));
  }

  function scheduleReconnect(delay = 800) {
    if (document.hidden || reconnectTimer !== null) return;
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, delay);
  }

  let pendingDx = 0;
  let pendingDy = 0;
  let pendingScroll = 0;
  let motionRetry = null;
  let smoothMoveTimer = null;

  function connect() {
    if (document.hidden) return;
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
    const socket = new WebSocket(`${wsProto}//${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws = socket;
    socket.onopen = () => {
      if (ws !== socket) return;
      document.getElementById("dot").classList.add("connected");
      document.getElementById("statusText").textContent = "接続中";
      showConnectionAlert();
      startQualityMonitor(socket);
    };
    socket.onclose = async (event) => {
      if (ws !== socket) return;
      clearTimeout(motionRetry);
      motionRetry = null;
      clearTimeout(smoothMoveTimer);
      smoothMoveTimer = null;
      pendingDx = pendingDy = pendingScroll = 0;
      stopQualityMonitor();
      document.getElementById("dot").classList.remove("connected");
      if (event.code === 4005) {
        document.getElementById("statusText").textContent = "別のタブで接続中です。前のタブを使ってください。";
        return;
      }
      if (event.code === 4002) {
        document.getElementById("statusText").textContent = "新しいQRコードを読み取ってください";
        showConnectionAlert("このQRコードは更新されました。PC画面の新しいQRを読み取ってください。");
        return;
      }
      if (event.code === 4003) {
        document.getElementById("statusText").textContent = document.hidden ? "一時停止中" : "再接続中";
        if (!document.hidden) scheduleReconnect(0);
        return;
      }
      if (document.hidden) {
        document.getElementById("statusText").textContent = "一時停止中";
        return;
      }
      if (event.code === 1006) {
        try {
          const check = await fetch(`/check?token=${encodeURIComponent(token)}`, { cache: "no-store" });
          if (ws !== socket) return;
          if (check.status === 410) {
            document.getElementById("statusText").textContent = "QRコードが古いです";
            showConnectionAlert("このQRコードは使えなくなっています。PC画面で「QRを更新」を押し、新しいQRを読み取ってください。");
            return;
          }
        } catch (_) {}
      }
      document.getElementById("statusText").textContent = "再接続";
      scheduleReconnect();
    };
    socket.onmessage = (e) => {
      if (ws !== socket) return;
      const msg = JSON.parse(e.data);
      if (msg.type === "pong") {
        const sentAt = pendingPings.get(String(msg.id));
        if (sentAt === undefined) return;
        pendingPings.delete(String(msg.id));
        const rtt = performance.now() - sentAt;
        if (rtt > 6000) return;
        lastPongAt = Date.now();
        recentRtts.push(rtt);
        if (recentRtts.length > 3) recentRtts.shift();
        const averageRtt = recentRtts.reduce((sum, value) => sum + value, 0) / recentRtts.length;
        setSignalBars(averageRtt < 120 ? 3 : averageRtt < 350 ? 2 : 1, socket);
        return;
      }
      if (msg.type === "init_settings" && msg.settings) {
        document.getElementById("sensRange").value = msg.settings.sensitivity;
        document.getElementById("sensVal").textContent = msg.settings.sensitivity;
        document.getElementById("scrollRange").value = msg.settings.scroll_speed;
        document.getElementById("scrollVal").textContent = msg.settings.scroll_speed;
        document.getElementById("invertChk").checked = msg.settings.invert_scroll;
      }
    };
  }
  connect();

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (reconnectTimer !== null) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      stopQualityMonitor();
      return;
    }
    if (ws && ws.readyState === WebSocket.OPEN) startQualityMonitor(ws);
    else if (!ws || ws.readyState === WebSocket.CLOSED) connect();
  });

  window.addEventListener("pagehide", () => {
    if (reconnectTimer !== null) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    if (ws && ws.readyState < WebSocket.CLOSING) {
      ws.close(4004, "スマホのタブが閉じられました");
    }
  });

  function sendNow(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      flushMotion(true);
      ws.send(JSON.stringify(obj));
    }
  }

  function flushMotion(beforeAction = false) {
    clearTimeout(smoothMoveTimer);
    smoothMoveTimer = null;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pendingDx = pendingDy = pendingScroll = 0;
      return;
    }
    const hasMove = pendingDx !== 0 || pendingDy !== 0;
    const hasScroll = Math.abs(pendingScroll) >= 0.4;
    if (!hasMove && !hasScroll) return;

    if (!beforeAction && ws.bufferedAmount >= 512) {
      if (motionRetry === null) {
        motionRetry = setTimeout(() => {
          motionRetry = null;
          flushMotion();
        }, 16);
      }
      return;
    }

    clearTimeout(motionRetry);
    motionRetry = null;
    if (hasMove) {
      ws.send(JSON.stringify({ type: "move", dx: pendingDx, dy: pendingDy }));
      pendingDx = pendingDy = 0;
    }
    if (hasScroll) {
      ws.send(JSON.stringify({ type: "scroll", dy: Math.round(pendingScroll * 100) / 100 }));
      pendingScroll = 0;
    }
  }

  const pad = document.getElementById("pad");
  const dragBadge = document.getElementById("dragBadge");
  let lastX = 0, lastY = 0;
  let startX = 0, startY = 0;
  let startTime = 0;
  let moved = false, maxFingers = 0;
  let leftHeld = false;
  let suppressPadTap = false;
  let pointerId = null;
  let receivedPointerMove = false;
  let receivedRawMove = false;
  let isDragging = false, pendingSecondTap = false;
  let singleClickTimer = null, dragHoldTimer = null;
  let twoFingerStartX = 0, twoFingerStartY = 0, swipeTriggered = false;

  function startDragMode() {
    if (!pendingSecondTap || isDragging) return;
    pendingSecondTap = false;
    isDragging = true;
    if (!leftHeld) sendNow({ type: "mouse_down" });
    pad.classList.add("dragging");
    dragBadge.classList.add("visible");
  }

  pad.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const now = Date.now();
    const touches = e.targetTouches;
    if (maxFingers === 0) suppressPadTap = leftHeld;
    maxFingers = Math.max(maxFingers, touches.length);

    if (touches.length === 1) {
      lastX = startX = touches[0].clientX;
      lastY = startY = touches[0].clientY;
      startTime = now;
      moved = false;

      if (!suppressPadTap && singleClickTimer !== null) {
        clearTimeout(singleClickTimer);
        singleClickTimer = null;
        pendingSecondTap = true;
        dragHoldTimer = setTimeout(startDragMode, 140);
      }
    } else if (touches.length === 2) {
      if (singleClickTimer !== null) {
        clearTimeout(singleClickTimer);
        singleClickTimer = null;
      }
      pendingSecondTap = false;
      twoFingerStartX = (touches[0].clientX + touches[1].clientX) / 2;
      twoFingerStartY = lastY = (touches[0].clientY + touches[1].clientY) / 2;
      swipeTriggered = false;
    }
  }, { passive: false });

  function moveCursor(x, y) {
    const dx = x - lastX;
    const dy = y - lastY;

    if (Math.hypot(x - startX, y - startY) > 6) {
      moved = true;
      if (pendingSecondTap) {
        clearTimeout(dragHoldTimer);
        dragHoldTimer = null;
        startDragMode();
      }
    }

    pendingDx += dx;
    pendingDy += dy;
    lastX = x;
    lastY = y;
    const distance = Math.max(Math.abs(dx), Math.abs(dy));
    if (distance > 6) {
      flushMotion();
    } else if (smoothMoveTimer === null) {
      if (distance < 2 || motionRetry !== null || !ws ||
          ws.readyState !== WebSocket.OPEN || ws.bufferedAmount >= 512) {
        flushMotion();
        return;
      }
      // Send the leading half now and spread the rest over one short interval.
      pendingDx -= dx / 2;
      pendingDy -= dy / 2;
      flushMotion();
      pendingDx = dx / 2;
      pendingDy = dy / 2;
      smoothMoveTimer = setTimeout(flushMotion, 8);
    }
  }

  pad.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || pointerId !== null) return;
    pointerId = e.pointerId;
    receivedPointerMove = receivedRawMove = false;
  });

  function handlePointerMove(e) {
    if (maxFingers !== 1 || pointerId === null || e.pointerId !== pointerId) return;
    if (e.type === "pointerrawupdate") receivedRawMove = true;
    else if (receivedRawMove) return;
    receivedPointerMove = true;
    moveCursor(e.clientX, e.clientY);
  }

  pad.addEventListener("pointermove", handlePointerMove);
  pad.addEventListener("pointerrawupdate", handlePointerMove);
  pad.addEventListener("pointercancel", (e) => {
    if (e.pointerId !== pointerId) return;
    pointerId = null;
    receivedPointerMove = receivedRawMove = false;
  });

  pad.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const touches = e.targetTouches;
    if (touches.length === 1 && maxFingers === 1) {
      if (!receivedPointerMove) moveCursor(touches[0].clientX, touches[0].clientY);
    } else if (touches.length === 2) {
      const midX = (touches[0].clientX + touches[1].clientX) / 2;
      const midY = (touches[0].clientY + touches[1].clientY) / 2;
      const totalDx = midX - twoFingerStartX;
      const totalDy = midY - twoFingerStartY;

      if (Math.hypot(totalDx, totalDy) > 6) moved = true;

      if (!swipeTriggered && Math.abs(totalDx) > 75 && Math.abs(totalDx) > Math.abs(totalDy) * 1.8) {
        swipeTriggered = true;
        sendNow({ type: totalDx > 0 ? "back" : "forward" });
      } else if (!swipeTriggered) {
        pendingScroll += (midY - lastY);
        flushMotion();
      }
      lastY = midY;
    }
  }, { passive: false });

  pad.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (e.targetTouches.length === 0) {
      const now = Date.now();
      const dt = now - startTime;

      if (dragHoldTimer !== null) {
        clearTimeout(dragHoldTimer);
        dragHoldTimer = null;
      }

      if (isDragging) {
        isDragging = false;
        if (!leftHeld) sendNow({ type: "mouse_up" });
        pad.classList.remove("dragging");
        dragBadge.classList.remove("visible");
      } else if (pendingSecondTap) {
        pendingSecondTap = false;
        sendNow({ type: "double_click" });
      } else if (!suppressPadTap && !moved && dt < 320) {
        if (maxFingers === 1) {
          singleClickTimer = setTimeout(() => {
            singleClickTimer = null;
            sendNow({ type: "click" });
          }, 300);
        } else if (maxFingers >= 2) {
          sendNow({ type: "right_click" });
        }
      }
      maxFingers = 0;
      pointerId = null;
      receivedPointerMove = receivedRawMove = false;
    }
  }, { passive: false });

  pad.addEventListener("touchcancel", () => {
    clearTimeout(dragHoldTimer);
    dragHoldTimer = null;
    pendingSecondTap = false;
    maxFingers = 0;
    pointerId = null;
    receivedPointerMove = receivedRawMove = false;
    if (isDragging) {
      isDragging = false;
      if (!leftHeld) sendNow({ type: "mouse_up" });
      pad.classList.remove("dragging");
      dragBadge.classList.remove("visible");
    }
  });

  const leftBtn = document.getElementById("leftBtn");
  leftBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (leftHeld) return;
    leftHeld = true;
    suppressPadTap = true;
    clearTimeout(singleClickTimer);
    singleClickTimer = null;
    clearTimeout(dragHoldTimer);
    dragHoldTimer = null;
    pendingSecondTap = false;
    leftBtn.classList.add("active");
    if (!isDragging) sendNow({ type: "mouse_down" });
  }, { passive: false });
  function releaseLeftButton(e) {
    e.preventDefault();
    if (!leftHeld || e.targetTouches.length > 0) return;
    leftHeld = false;
    leftBtn.classList.remove("active");
    if (!isDragging) sendNow({ type: "mouse_up" });
  }
  leftBtn.addEventListener("touchend", releaseLeftButton, { passive: false });
  leftBtn.addEventListener("touchcancel", releaseLeftButton, { passive: false });

  document.getElementById("selectAllBtn").onclick = () => sendNow({ type: "select_all" });
  document.getElementById("copyBtn").onclick = () => sendNow({ type: "copy" });

  const rightBtn = document.getElementById("rightBtn");
  rightBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    rightBtn.classList.add("active");
    sendNow({ type: "right_click" });
  });
  rightBtn.addEventListener("touchend", (e) => {
    e.preventDefault();
    rightBtn.classList.remove("active");
  });

  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");

  function endTextEntry() {
    textInput.readOnly = true;
    textInput.blur();
  }

  function handleControlPress(e) {
    if (textInput.contains(e.target)) {
      textInput.readOnly = false;
    } else if (!textInput.readOnly && !sendBtn.contains(e.target)) {
      endTextEntry();
    }
  }

  document.addEventListener("pointerdown", handleControlPress, { capture: true });
  document.addEventListener("touchstart", handleControlPress, { capture: true, passive: true });
  textInput.addEventListener("blur", () => { textInput.readOnly = true; });

  function submitText() {
    if (textInput.value) {
      sendNow({ type: "type_text", text: textInput.value });
      textInput.value = "";
    }
    endTextEntry();
  }
  sendBtn.onclick = submitText;
  textInput.addEventListener("keydown", (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === "Escape") {
      endTextEntry();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      if (textInput.readOnly) textInput.readOnly = false;
      else submitText();
    }
  });

  document.getElementById("backBtn").onclick = () => sendNow({ type: "back" });
  document.getElementById("fwdBtn").onclick = () => sendNow({ type: "forward" });
  document.getElementById("escBtn").onclick = () => sendNow({ type: "key_press", key: "escape" });
  document.getElementById("tabBtn").onclick = () => sendNow({ type: "key_press", key: "tab" });
  document.getElementById("spaceBtn").onclick = () => sendNow({ type: "key_press", key: "space" });
  document.getElementById("bsBtn").onclick = () => sendNow({ type: "key_press", key: "backspace" });
  document.getElementById("enterBtn").onclick = () => sendNow({ type: "key_press", key: "enter" });

  const panel = document.getElementById("settings-panel");
  document.getElementById("cfgBtn").onclick = () => panel.classList.add("open");
  document.getElementById("closeCfgBtn").onclick = () => {
    sendNow({ type: "save_settings" });
    panel.classList.remove("open");
  };

  document.getElementById("sensRange").oninput = (e) => {
    document.getElementById("sensVal").textContent = e.target.value;
    sendNow({ type: "preview_settings", sensitivity: parseFloat(e.target.value) });
  };
  document.getElementById("scrollRange").oninput = (e) => {
    document.getElementById("scrollVal").textContent = e.target.value;
    sendNow({ type: "preview_settings", scroll_speed: parseFloat(e.target.value) });
  };
  document.getElementById("invertChk").onchange = (e) => {
    sendNow({ type: "preview_settings", invert_scroll: e.target.checked });
  };
</script>
</body>
</html>
